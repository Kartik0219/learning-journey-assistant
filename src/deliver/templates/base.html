<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Learning Journey Assistant{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0b1f;
      --surface: #1a1530;
      --surface-2: #221c3f;
      --ring-hole: #1a1530;
      --border: rgba(244,241,255,0.10);
      --border-strong: rgba(244,241,255,0.16);
      --ink: #f4f1ff;
      --muted: #a99fce;
      --accent: #baff3c;
      --accent-ink: #0f1400;
      --violet: #8f6bff;
      --pink: #ff4fa3;
      --good: #baff3c;
      --warn: #ffb545;
      --bad: #ff5c7c;
      --font-display: 'Unbounded', 'Manrope', -apple-system, "Segoe UI", Calibri, Arial, sans-serif;
      --font: 'Manrope', -apple-system, "Segoe UI", Calibri, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    header.top {
      background: var(--bg);
      border-bottom: 3px solid var(--accent);
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header.top a { color: var(--ink); text-decoration: none; }
    header.top a:hover { color: var(--accent); }
    header.top .brand {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }
    header.top span { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 70px; }

    .dash-layout { display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start; }
    .dash-side { position: sticky; top: 20px; }
    @media (max-width: 880px) {
      .dash-layout { grid-template-columns: 1fr; }
      .dash-side { position: static; }
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 24px 26px;
      margin-bottom: 20px;
      box-shadow: 7px 7px 0 rgba(0,0,0,0.45);
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
      color: var(--ink);
    }
    h2 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.005em;
      margin: 0 0 10px;
      color: var(--ink);
    }
    p.muted, span.muted { color: var(--muted); font-size: 0.92rem; line-height: 1.6; }

    .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-tile {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 18px 18px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 5px 5px 0 rgba(0,0,0,0.4);
    }
    .stat-value {
      font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: var(--accent);
      font-variant-numeric: tabular-nums; line-height: 1;
      text-shadow: 0 0 18px rgba(186,255,60,0.35);
    }
    .stat-tile.warn .stat-value { color: var(--warn); text-shadow: 0 0 18px rgba(255,181,69,0.35); }
    .stat-label { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

    .ring {
      --size: 74px;
      width: var(--size); height: var(--size);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex: none;
      background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct) * 1%), var(--surface-2) 0);
      filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ring-color, var(--accent)) 45%, transparent));
    }
    .ring::before { content: ""; position: absolute; inset: 7px; background: var(--ring-hole); border-radius: 50%; }
    .ring-value { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 0.88rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .ring.ring-sm { --size: 56px; }
    .ring.ring-sm .ring-value { font-size: 0.72rem; }
    .ring-good { --ring-color: var(--good); }
    .ring-warn { --ring-color: var(--warn); }
    .ring-bad { --ring-color: var(--bad); }

    .mastery-bar-track { background: var(--surface-2); border-radius: 999px; height: 10px; overflow: hidden; margin: 8px 0 6px; }
    .mastery-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 11px;
      border-radius: 999px;
      color: var(--accent-ink);
    }
    .badge.low { background: var(--good); }
    .badge.medium { background: var(--warn); }
    .badge.high { background: var(--bad); }
    .badge.quiz-recall { background: var(--violet); color: #100a24; }
    .badge.quiz-apply { background: var(--accent); }
    .badge.quiz-evaluate { background: var(--pink); color: #22001a; }

    .quiz-question, .gap-item {
      border-radius: 12px;
      padding: 12px 14px;
      margin: 9px 0;
      font-size: 0.92rem;
      line-height: 1.6;
      border: 1px solid var(--border);
    }
    .quiz-question { background: var(--surface-2); }
    .gap-item { background: var(--surface-2); }

    .recommendation {
      background: var(--surface-2);
      border: 1.5px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 14px;
      font-size: 0.94rem;
    }
    .recommendation strong { color: var(--accent); }
    .recommendation p { margin: 8px 0 12px; }

    form.inline { display: inline; }
    button, select, input { font: inherit; }
    select, input[type="text"], input[type="password"] {
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--surface-2);
      color: var(--ink);
    }
    select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 800;
      font-family: var(--font-display);
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
    }
    button.primary:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 rgba(0,0,0,0.5); }
    button.primary:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 rgba(0,0,0,0.5); }
    .error { color: var(--bad); font-size: 0.9rem; margin-top: 8px; font-weight: 700; }

    .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; }
    .outcomes-grid .card { margin-bottom: 0; }
    .outcome-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 6px; }
    .outcome-head h2 { margin: 0; flex: 1; }
    .outcome-index {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--surface-2); border: 1px solid var(--border-strong);
      font-family: var(--font-display); font-size: 0.65rem; font-weight: 700; color: var(--accent);
      margin-right: 8px; flex: none;
    }

    .priority-list { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; }
    .priority-row {
      display: flex; align-items: center; gap: 10px; padding: 11px 13px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    }
    .priority-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .priority-dot.good { background: var(--good); box-shadow: 0 0 8px rgba(186,255,60,0.6); }
    .priority-dot.warn { background: var(--warn); box-shadow: 0 0 8px rgba(255,181,69,0.6); }
    .priority-dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(255,92,124,0.6); }
    .priority-text { flex: 1; font-size: 0.85rem; line-height: 1.4; color: var(--ink); }
    .priority-pct { font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .priority-pct.good { color: var(--good); }
    .priority-pct.warn { color: var(--warn); }
    .priority-pct.bad { color: var(--bad); }

    table.priority { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 6px; }
    table.priority th {
      text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 700; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--border-strong);
    }
    table.priority td { padding: 12px 10px; font-size: 0.92rem; border-bottom: 1px solid var(--border); }
    table.priority tr:last-child td { border-bottom: none; }
    table.priority tr:hover td { background: var(--surface-2); }
    table.priority td:last-child, table.priority th:last-child {
      text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); white-space: nowrap;
    }

    .staff-switcher { margin-bottom: 20px; }
    .coordinator-outcome { padding: 16px 0; border-top: 1px solid var(--border); }
    .coordinator-outcome:first-of-type { border-top: none; padding-top: 0; }

    .subject-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
    .subject-chip {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
      background: var(--surface-2); border: 1.5px solid var(--border-strong); border-radius: 16px; padding: 20px 14px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    }
    .subject-chip-code {
      font-family: var(--font-display); font-weight: 700; font-size: 0.72rem;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
    }

    .auth-shell { max-width: 420px; margin: 48px auto 0; }
    .role-picker { display: flex; gap: 6px; padding: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; margin: 12px 0 18px; }
    .role-picker label {
      position: relative; flex: 1; text-align: center; padding: 10px 8px; border-radius: 9px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); cursor: pointer;
    }
    .role-picker label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
    .role-picker input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }

    code {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; font-size: 0.88em; color: var(--accent);
    }

    @media (max-width: 600px) {
      header.top { padding: 14px 18px; flex-direction: column; align-items: flex-start; gap: 6px; }
      main { padding: 20px 12px 40px; }
      .card { padding: 18px; box-shadow: 5px 5px 0 rgba(0,0,0,0.45); }
      table.priority { display: block; overflow-x: auto; }
      .subject-overview { grid-template-columns: 1fr 1fr; }
      .outcomes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="{{ url_for('index') }}" class="brand">Learning Journey Assistant</a>
    {% if session.get('role') %}
      <span>
        {% if session.get('role') in ('staff', 'admin') %}
          <a href="{{ url_for('coordinator') }}">Coordinator report</a> —
        {% endif %}
        {{ session.get('role')|capitalize }} — <a href="{{ url_for('logout') }}">Log out</a>
      </span>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
