<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Learning Journey Assistant{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --navy: #1f3a5f;
      --accent: #2e6f6e;
      --bg: #f6f8f7;
      --card: #ffffff;
      --border: #dde3e1;
      --text: #23302c;
      --muted: #5b6670;
      --low: #b23b3b;
      --medium: #b8860b;
      --high: #b23b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Calibri, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header.top {
      background: var(--navy);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header.top a { color: #fff; text-decoration: none; }
    header.top .brand { font-weight: 600; font-size: 1.05rem; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    h2 { font-size: 1.15rem; margin: 0 0 4px; color: var(--navy); }
    p.muted, span.muted { color: var(--muted); font-size: 0.92rem; }
    .mastery-bar-track {
      background: #e7ebe9;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      margin: 8px 0 4px;
    }
    .mastery-bar-fill { height: 100%; background: var(--accent); }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      color: #fff;
    }
    .badge.low { background: #6b9b4f; }
    .badge.medium { background: var(--medium); }
    .badge.high { background: var(--high); }
    .gap-item {
      border-left: 3px solid var(--medium);
      padding: 6px 10px;
      margin: 6px 0;
      background: #fbf7ee;
      font-size: 0.92rem;
    }
    .recommendation {
      background: #eef3f2;
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 0.94rem;
    }
    form.inline { display: inline; }
    button, select, input {
      font: inherit;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      cursor: pointer;
    }
    button.primary:hover { opacity: 0.9; }
    .error { color: var(--low); font-size: 0.9rem; margin-top: 8px; }
    table.priority { width: 100%; border-collapse: collapse; margin-top: 6px; }
    table.priority td, table.priority th { text-align: left; padding: 4px 6px; font-size: 0.9rem; }
    .staff-switcher { margin-bottom: 14px; }
  </style>
</head>
<body>
  <header class="top">
    <a href="{{ url_for('index') }}" class="brand">Learning Journey Assistant</a>
    {% if session.get('role') %}
      <span>{{ session.get('role')|capitalize }} — <a href="{{ url_for('logout') }}">Log out</a></span>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
