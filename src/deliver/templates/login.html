{% extends "base.html" %}
{% block title %}Log in — Learning Journey Assistant{% endblock %}
{% block content %}
  <div class="auth-shell">
    <div class="card">
      <h1>Log in</h1>
      <p class="muted">Sign in to view your learning journey.</p>

      <form method="post">
        <fieldset style="border:none; padding:0; margin: 16px 0 0;">
          <legend class="muted" style="font-weight:700; margin-bottom:2px;">I am a...</legend>
          <div class="role-picker">
            <label><input type="radio" name="role" value="student" checked onchange="ljasToggleLoginFields()"> Student</label>
            <label><input type="radio" name="role" value="staff" onchange="ljasToggleLoginFields()"> Staff</label>
            <label><input type="radio" name="role" value="admin" onchange="ljasToggleLoginFields()"> Admin</label>
          </div>
        </fieldset>

        <div id="ljas-student-field" style="margin-bottom:10px;">
          <label for="student_number">Student number</label><br>
          <input type="text" id="student_number" name="student_number" autocomplete="username" style="width:100%;">
        </div>
        <div id="ljas-username-field" style="margin-bottom:10px; display:none;">
          <label for="username">Username</label><br>
          <input type="text" id="username" name="username" autocomplete="username" style="width:100%;">
        </div>
        <div style="margin-bottom:14px;">
          <label for="password">Password</label><br>
          <input type="password" id="password" name="password" autocomplete="current-password" style="width:100%;">
        </div>

        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <button class="primary" type="submit" style="width:100%;">Log in</button>
      </form>

      <p class="muted" style="margin-top:16px; font-size:0.8rem; text-align:center;">
        Demo: student <code>DEMO0001</code> / <code>DEMO0001</code> ·
        staff <code>staff</code> / <code>staff123</code>
      </p>
    </div>
  </div>

  <script>
    function ljasToggleLoginFields() {
      var role = document.querySelector('input[name="role"]:checked').value;
      var isStudent = role === 'student';
      document.getElementById('ljas-student-field').style.display = isStudent ? 'block' : 'none';
      document.getElementById('ljas-username-field').style.display = isStudent ? 'none' : 'block';
    }
  </script>
{% endblock %}
