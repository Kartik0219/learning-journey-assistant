# Render Blueprint for the Learning Journey Assistant demo deployment.
#
# Deliberately runs on the bundled synthetic data/sample/ dataset, not the
# real provided .xlsx (data/provided/ is gitignored and never leaves local
# dev - see src/config.py and .env.example). HISTORICAL_DATASET_PATH is
# left unset below on purpose: src.parse.cleaners then falls back to the
# sample CSVs automatically, exactly like `pytest` and a fresh clone do.
#
# The start command re-runs the pipeline on every boot (init_db + parse +
# model + estimate stages), so the SQLite file is regenerated from the
# sample CSVs each time the free-tier instance spins up - no persistent
# disk needed, and nothing sensitive ever touches this service.
services:
  - type: web
    name: learning-journey-assistant-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "python -m src.pipeline && gunicorn 'src.deliver.app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./ljas_demo.db
      - key: APP_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # HISTORICAL_DATASET_PATH intentionally omitted - do not set it here.
      # Setting it would point the pipeline at data/provided/, which isn't
      # in this repo and shouldn't be: this service is sample-data only.
      #
      # --- Optional AI (LLM) path (IOG-37/39/52/53) --------------------------
      # The AI insight page (/ai-insight) is OFF unless a provider is set.
      # Leaving these unset keeps the deploy on the local, explainable TF-IDF
      # engine (the tender's no-hallucination / free-tier default). To enable
      # it, uncomment and set the key in the Render dashboard (sync: false
      # means the value is entered there, never committed).
      #
      # Gemini - recommended here: free tier, and no extra package to install
      # because it goes over REST with `requests`:
      # - key: LLM_PROVIDER
      #   value: gemini
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL
      #   value: gemini-flash-latest
      #
      # Claude - needs `anthropic` uncommented in requirements.txt and paid
      # API credit:
      # - key: LLM_PROVIDER
      #   value: anthropic
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL
      #   value: claude-sonnet-4-5
      # Note: enabling this sends student feedback text to an external API on
      # each analysis, so confirm consent (N2) and cost before switching on.
